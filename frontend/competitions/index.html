<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRank</title>
    <link rel="icon" type="image/png" href="/images/favicon.png?v=2">
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.cdnfonts.com/css/d-din" rel="stylesheet">
</head>
<body>
    <nav class="headerbox"></nav>
    <main>
        <h1 class="welcometext">Competitions</h1>
        <div class="calendarlayout">
            <div class="calendarbox">
                <div class="calendarheader" id="calendarheader">
                    <button id="prevmonth" class="calendarbutton" aria-label="Previous month">&lt;</button>
                    <button id="nextmonth" class="calendarbutton" aria-label="Next month">&gt;</button>
                    <div id="monthyear" class="monthyear"></div>
                </div>
                <div class="calendarlabels">
                    <div class="calendarlabel">Sun</div>
                    <div class="calendarlabel">Mon</div>
                    <div class="calendarlabel">Tue</div>
                    <div class="calendarlabel">Wed</div>
                    <div class="calendarlabel">Thu</div>
                    <div class="calendarlabel">Fri</div>
                    <div class="calendarlabel">Sat</div>
                </div>
                <div id="calendarcontainer"></div>
            </div>
            <aside class="savedcompetitionspanel" id="savedCompetitionsPanel">
                <h2 class="savedcompetitionsheader">Saved Competitions</h2>
                <p class="savedcompetitionsempty" id="savedCompetitionsEmpty">Loading your saved competitions...</p>
                <ul class="savedcompetitionslist" id="savedCompetitionsList"></ul>
                <div class="calendaractions">
                    <a href="/competitions/add/" id="addCompetitionButton" class="topicdetailback hidden">Add Competition</a>
                    <form id="joinCompetitionForm" class="joincompetitionform">
                        <input type="text" id="joinCompetitionCode" class="inputs" placeholder="Enter invite code">
                        <button type="submit" class="resetbutton">Join</button>
                    </form>
                </div>
            </aside>
        </div>
    </main>
    <footer class="sitefooter"></footer>
    <script src="/script.js"></script>
    <script src="/competitions/calendar.js"></script>
</body>
</html>
