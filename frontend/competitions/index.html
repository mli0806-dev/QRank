<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRank</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav class="headerbox">
        <div class="left">
            <a href="/" class="sitetitle">QRank - Competition Calendar </a>
            <ul class="tablist">
                <li><a class="tabitems" href="/topics/">Topics</a></li>
                <li><a class="tabitems" href="/problems/">Problem Sets</a></li>
                <li><a class="tabitems" href="/competitions/">Competitions</a></li>
                <li><a class="tabitems" href="/rankings/">Rankings</a></li>
            </ul>
        </div>
        <div class="right">
            <button id="themetoggler" class="themebutton">Dark Mode</button>
            <p class="credits">Made by Mitchell Li</p>
        </div>
    </nav>
    <main>
        <h1 class="welcometext">Competition Calendar</h1>
        <div class="calendarbox">
            <div class="calendarheader" id="calendarheader">
                <button id="prevmonth" class="calendarbutton">Previous Month</button>
                <button id="nextmonth" class="calendarbutton">Next Month</button>
                <div id="monthyear" class="monthyear"></div>
            </div>
            <div class="calendarlabels">
                <div class="calendarlabel">Sun</div>
                <div class="calendarlabel">Mon</div>
                <div class="calendarlabel">Tue</div>
                <div class="calendarlabel">Wed</div>
                <div class="calendarlabel">Thu</div>
                <div class="calendarlabel">Fri</div>
                <div class="calendarlabel">Sat</div>
            </div>
            <div id="calendarcontainer"></div>
        </div>
    </main>
    <script src="calendar.js"></script>
    <script src="../script.js"></script>
</body>
</html>
