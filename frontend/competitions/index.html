<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRank</title>
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.cdnfonts.com/css/d-din" rel="stylesheet">
</head>
<body>
    <nav class="headerbox">
        <div class="left">
            <a href="/" class="sitetitle">QRank - Competition Calendar </a>
            <ul class="tablist">
                <li><a class="tabitems" href="/topics/">Topics</a></li>
                <li><a class="tabitems" href="/problems/">Problem Sets</a></li>
                <li><a class="tabitems" href="/competitions/">Competitions</a></li>
                <li><a class="tabitems" href="/rankings/">Rankings</a></li>
                <li><a class="tabitems" href="/about/">About Us</a></li>
                <li><a class="tabitems" href="/contribute/">Contribute</a></li>
            </ul>
        </div>
        <div class="right">
            <button id="themetoggler" class="themebutton">Dark Mode</button>
            <a class="login" href="/login/">Login</a>
        </div>
    </nav>
    <main>
        <h1 class="welcometext">Competitions</h1>
        <div class="calendarbox">
            <div class="calendarheader" id="calendarheader">
                <button id="prevmonth" class="calendarbutton" aria-label="Previous month">&lt;</button>
                <button id="nextmonth" class="calendarbutton" aria-label="Next month">&gt;</button>
                <div id="monthyear" class="monthyear"></div>
            </div>
            <div class="calendarlabels">
                <div class="calendarlabel">Sun</div>
                <div class="calendarlabel">Mon</div>
                <div class="calendarlabel">Tue</div>
                <div class="calendarlabel">Wed</div>
                <div class="calendarlabel">Thu</div>
                <div class="calendarlabel">Fri</div>
                <div class="calendarlabel">Sat</div>
            </div>
            <div id="calendarcontainer"></div>
        </div>
        <div class="competitionsearch">
            <iframe src="https://doq.world" height="400px" width="600px" frameborder="0"></iframe>
        </div>
    </main>
    <footer class="sitefooter">© 2026 QRank. All rights reserved. · <a class="footerlink" href="/tos/">Terms of Service</a> · <a class="footerlink" href="/privacy/">Privacy Policy</a></footer>
    <script src="/competitions/calendar.js"></script>
    <script src="/script.js"></script>
</body>
</html>
