<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRank - Contribute</title>
    <link rel="icon" type="image/png" href="/images/favicon.png?v=2">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/vendor/katex/katex.min.css">
    <link href="https://fonts.cdnfonts.com/css/d-din" rel="stylesheet">
</head>
<body>
    <nav class="headerbox"></nav>
    <main>
        <form id="suggest-problem-set-form" class="suggestionform problemsetdetailpage">
            <div class="problemsetdetailleft">
                <p class="aboutustitle" id="contribute-page-heading">Contribute to QRank</p>
                <p class="aboutustext" id="contribute-page-subtext">Submit a suggested problem set below and it will be added to our review queue.</p>

                <div id="suggest-fields">
                    <label class="aboutustitle" for="suggest-name">Problem set name</label>
                    <input id="suggest-name" class="inputs" type="text" placeholder="Example: Algebra II Review" required>

                    <label class="aboutustitle" for="suggest-course">Course</label>
                    <select id="suggest-course" class="inputs" required>
                        <option value="" disabled selected>Select a course</option>
                    </select>

                    <label class="aboutustitle" for="suggest-topic">Topic</label>
                    <select id="suggest-topic" class="inputs" required>
                        <option value="" disabled selected>Select a course first</option>
                    </select>

                    <label class="aboutustitle" for="suggest-subtopic">Subtopic (optional)</label>
                    <select id="suggest-subtopic" class="inputs">
                        <option value="" selected>No specific subtopic</option>
                    </select>

                    <label class="aboutustitle" for="suggest-tags">Tags</label>
                    <select id="suggest-tags" class="inputs" multiple size="6"></select>

                    <label class="profiletoggle" for="suggest-calculator-allowed">
                        <input type="checkbox" id="suggest-calculator-allowed">
                        <span>Calculator approved</span>
                    </label>

                    <label class="profiletoggle" for="suggest-is-private">
                        <input type="checkbox" id="suggest-is-private">
                        <span>Private (only visible to you)</span>
                    </label>

                    <label class="profiletoggle hidden" for="suggest-assessment-enabled" id="suggest-assessment-field">
                        <input type="checkbox" id="suggest-assessment-enabled">
                        <span>Assessment enabled</span>
                    </label>

                    <label class="aboutustitle" for="suggest-time-limit">Time limit in minutes (optional)</label>
                    <input id="suggest-time-limit" class="inputs" type="number" min="1" step="1" placeholder="No time limit">

                    <label class="aboutustitle" for="suggest-description">Description</label>
                    <textarea id="suggest-description" class="inputs" rows="4" placeholder="Brief description of the set"></textarea>
                </div>

                <div id="problem-builder-toc" class="problemtoc"></div>

                <button type="submit" class="authsubmit">Submit suggestion</button>
                <div id="suggestion-status" class="problemsetstatus" aria-live="polite"></div>
            </div>
            <div class="problemsetdetailright">
                <div class="problem-builder">
                    <div class="problem-builder-header">
                        <span class="aboutustitle">Problems</span>
                        <button type="button" id="add-problem-button" class="authsubmit">Add problem</button>
                    </div>
                    <div id="problem-items" class="problem-items"></div>
                </div>
            </div>
        </form>
    </main>
    <footer class="sitefooter"></footer>
    <script src="/vendor/marked.min.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script src="/vendor/katex/katex.min.js"></script>
    <script src="/vendor/katex/auto-render.min.js"></script>
    <script type="module" src="/js/entry-contribute.js"></script>
</body>
</html>
