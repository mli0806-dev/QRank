<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRank - Login</title>
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.cdnfonts.com/css/d-din" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <nav class="headerbox">
        <div class="left">
            <a href="/" class="sitetitle">QRank - Competition Calendar </a>
            <ul class="tablist">
                <li><a class="tabitems" href="/topics/">Topics</a></li>
                <li><a class="tabitems" href="/problems/">Problem Sets</a></li>
                <li><a class="tabitems" href="/competitions/">Competitions</a></li>
                <li><a class="tabitems" href="/rankings/">Rankings</a></li>
                <li><a class="tabitems" href="/about/">About Us</a></li>
                <li><a class="tabitems" href="/contribute/">Contribute</a></li>
            </ul>
        </div>
        <div class="right">
            <button id="themetoggler" class="themebutton">Dark Mode</button>
            <a class="login" href="/login/">Login</a>
        </div>
    </nav>
    <main class="auth">
        <div class="authcontainer">
            <p style="font-size: 28px;">Login to QRank</p>
            <div id="login-error" class="autherrorhidden"></div>
            <form id="login-form" class="authform">
                <label for="login-email">Email Address:</label>
                <input class="inputs" type="email" id="login-email" required placeholder="tung@sahur.com">
                <label for="login-password">Password:</label>
                <input class="inputs" type="password" id="login-password" required placeholder="67676767">
                <button type="submit" class="authsubmit">Login</button>
            </form>
            <div class="authdivider">or continue with Google</div>
            <div id="google-login-error" class="autherrorhidden"></div>
            <div id="google-login-button" class="googlesigninbutton"></div>
        </div>
        <div class="authcontainer">
            <p style="font-size: 28px;">Register for QRank</p>
            <div id="register-error" class="autherrorhidden"></div>
            <form id="register-form" class="authform">
                <label for="register-username">Username:</label>
                <input class="inputs" type="text" id="register-username" required placeholder="Sigma">
                <label for="register-email">Email Address:</label>
                <input class="inputs" type="email" id="register-email" required placeholder="tung@sahur.com">
                <label for="register-password">Password:</label>
                <input class="inputs" type="password" id="register-password" required placeholder="67676767">
                <button type="submit" class="authsubmit">Register</button>
            </form>
            <div class="authdivider">or continue with Google</div>
            <div id="google-register-error" class="autherrorhidden"></div>
            <div id="google-register-button" class="googlesigninbutton"></div>
        </div>
    </main>
<footer class="sitefooter">© 2026 QRank. All rights reserved.</footer>
<script src="/script.js"></script>
<script src="/login/auth.js"></script>
</body>
</html>
