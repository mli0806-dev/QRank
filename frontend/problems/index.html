<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRank</title>
    <link rel="icon" type="image/png" href="/images/favicon.png?v=2">
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.cdnfonts.com/css/d-din" rel="stylesheet">
</head>
<body>
    <nav class="headerbox"></nav>
    <main class="problemsetpage">
        <section class="rankingsearchpanel">
            <form id="problem-set-search-form" class="rankingsearchform">
                <label class="rankingsearchlabel" for="problem-set-search">Search problem sets</label>
                <div class="rankingsearchcontrols">
                    <input id="problem-set-search" class="inputs rankingsearchinput" type="text" placeholder="Search by title or tag" autocomplete="off">
                    <button type="submit" class="authsubmit rankingsearchbutton">Go</button>
                </div>
            </form>
        </section>
        <section id="problem-set-results" class="problemsetresults" aria-live="polite"></section>
    </main>
    <footer class="sitefooter"></footer>
    <script src="/vendor/marked.min.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script src="/script.js"></script>
</body>
</html>
