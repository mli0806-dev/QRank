<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRank</title>
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.cdnfonts.com/css/d-din" rel="stylesheet">
</head>
<body>
    <nav class="headerbox">
        <div class="left">
            <a href="/" class="sitetitle">QRank - Leaderboard </a>
            <ul class="tablist">
                <li><a class="tabitems" href="/topics/">Topics</a></li>
                <li><a class="tabitems" href="/problems/">Problem Sets</a></li>
                <li><a class="tabitems" href="/competitions/">Competitions</a></li>
                <li><a class="tabitems" href="/rankings/">Rankings</a></li>
                <li><a class="tabitems" href="/login/">Login</a></li>
            </ul>
        </div>
        <div class="right">
            <button id="themetoggler" class="themebutton">Dark Mode</button>
            <p class="credits">Made by Mitchell Li</p>
        </div>
    </nav>
    <main>
        <section class="rankingsearchpanel">
            <form id="user-search-form" class="rankingsearchform">
                <label class="rankingsearchlabel" for="user-search">Search for a user</label>
                <div class="rankingsearchcontrols">
                    <input id="user-search" class="inputs rankingsearchinput" type="text" placeholder="Enter username" autocomplete="off">
                    <button type="submit" class="authsubmit rankingsearchbutton">Go</button>
                </div>
            </form>
        </section>
    </main>
    <footer class="sitefooter">© 2026 QRank. All rights reserved.</footer>
    <script src="../script.js"></script>
</body>
</html>
