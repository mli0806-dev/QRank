<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRank</title>
    <link rel="icon" type="image/png" href="/images/favicon.png?v=2">
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.cdnfonts.com/css/d-din" rel="stylesheet">
</head>
<body>
    <nav class="headerbox"></nav>
    <main>
        <section class="rankingsearchpanel">
            <form id="user-search-form" class="rankingsearchform">
                <label class="rankingsearchlabel" for="user-search">Search for a user</label>
                <div class="rankingsearchcontrols">
                    <input id="user-search" class="inputs rankingsearchinput" type="text" placeholder="Enter username" autocomplete="off">
                    <button type="submit" class="authsubmit rankingsearchbutton">Go</button>
                </div>
            </form>
        </section>
    </main>
    <footer class="sitefooter"></footer>
    <script src="/script.js"></script>
</body>
</html>
